plugins {
    id "com.android.application"
}

android {
    namespace "cz.voxelfrontier.lan"
    compileSdk 35

    defaultConfig {
        applicationId "cz.voxelfrontier.lan"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.nanohttpd:nanohttpd-websocket:2.3.1"
}

tasks.register("copyGameHtml", Copy) {
    from("../../index.html")
    into("src/main/assets")
}

preBuild.dependsOn(copyGameHtml)
